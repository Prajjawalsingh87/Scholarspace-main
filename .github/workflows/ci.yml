name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tool maths tests and search index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests (attendance, target CGPA, exam countdown maths)
        run: node --test
      - name: Search index is up to date
        run: node scripts/build-search-index.mjs --check
